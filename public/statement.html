<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Statement of Account</title>
  <link rel="icon" href="/logo.png">
  <style>
    /* A4 statement, printed on white whatever the screen theme */
    :root { --navy: #0b2265; --band: #dde9f6; --line: #222; --muted: #5a5a5a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #ecebe7; color: #111; font: 13px/1.4 Calibri, Carlito, "Segoe UI", system-ui, sans-serif; }
    .bar { position: sticky; top: 0; display: flex; gap: 8px; justify-content: center; align-items: center; padding: 10px; background: #fff; border-bottom: 1px solid #d6d4cc; z-index: 2; flex-wrap: wrap; }
    .bar button, .bar a { font: 600 13px system-ui, sans-serif; border: 1px solid #c9c7bf; background: #fff; color: #111; border-radius: 8px; padding: 7px 14px; cursor: pointer; text-decoration: none; }
    .bar button.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
    .bar .hint { font: 12px system-ui, sans-serif; color: var(--muted); }
    .page { width: 210mm; min-height: 297mm; margin: 18px auto; background: #fff; padding: 22mm 18mm 20mm; box-shadow: 0 2px 18px rgba(0, 0, 0, .12); }
    .logo { height: 46px; display: block; margin-bottom: 22px; }
    .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 22px; }
    .head h1 { margin: 0; font-size: 17px; font-weight: 400; text-decoration: underline; text-underline-offset: 3px; letter-spacing: .01em; }
    .head .date { font-weight: 700; font-size: 13.5px; }
    .cust b { display: block; margin-bottom: 3px; }
    .cust div { color: #333; line-height: 1.5; }
    .attn { margin: 18px 0 14px; color: #333; }
    .note { margin: 0 0 14px; color: #333; }
    table { width: 100%; border-collapse: collapse; }
    th { background: var(--navy); color: #fff; font-weight: 700; padding: 8px 6px; border: 1px solid var(--line); text-align: center; font-size: 13px; }
    td { border: 1px solid var(--line); padding: 2px 6px; font-size: 12.5px; color: #222; height: 19px; }
    td.c { text-align: center; } td.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    td.nw { white-space: nowrap; }
    td.od { color: #b42318; text-align: center; white-space: nowrap; }
    tr.band td { background: var(--band); font-weight: 700; color: #111; }
    tr.credit td { color: #555; font-style: italic; }
    .total { display: flex; justify-content: space-between; padding: 12px 2px 6px; border-bottom: 3px solid #000; font-weight: 700; font-size: 13.5px; }
    .total span:last-child { width: 32%; text-align: left; font-variant-numeric: tabular-nums; }
    .overdue-sum { margin-top: 8px; color: #b42318; font-size: 12.5px; }
    .sign { margin-top: 70px; width: 52mm; border-top: 1.5px solid #000; padding-top: 4px; }
    .sign b { display: block; }
    .sign span { color: #333; }
    .empty, .err { max-width: 520px; margin: 60px auto; background: #fff; padding: 24px; border-radius: 12px; font: 14px system-ui, sans-serif; text-align: center; }
    .err { color: #b42318; }
    @page { size: A4; margin: 0; }
    @media print {
      html, body { background: #fff; }
      .bar { display: none; }
      .page { margin: 0; box-shadow: none; width: auto; min-height: auto; }
      th, tr.band td { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .page + .page { page-break-before: always; }
    }
    @media (max-width: 820px) { .page { width: auto; margin: 10px; padding: 18px 14px; min-height: 0; } td, th { font-size: 11px; } }
  </style>
</head>
<body>
  <div class="bar"><button class="primary" id="print">Print / Save as PDF</button><a href="/" id="back">Back to dashboard</a><span class="hint">Choose "Save as PDF" in the print window to get a file.</span></div>
  <div id="out"><div class="empty">Loading statement…</div></div>
  <script type="module" src="/statement.js"></script>
</body>
</html>
